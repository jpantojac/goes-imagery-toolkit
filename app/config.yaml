# config.yaml - Core Project Configuration

general:
  institution: "Open Satellite Project"
  generate_tiff: true
  overwrite: false
  registry_file: "ultima_descarga.txt"

satellite:
  channels:
    - "01"
    - "02"
    - "03"
    - "04"
    - "05"
    - "06"
    - "07"
    - "08"
    - "09"
    - "10"
    - "11"
    - "12"
    - "13"
    - "14"
    - "15"
    - "16"
  channels_ideam:
    - "C01"
    - "C09"
    - "C13"
  base_url: "https://bart.ideam.gov.co/ospa/sensores/pasivos/satelite/GOES19/RAW/"
  satellite: "G19"

paths:
  base: ""  # Leave empty to dynamically resolve project root
  input: "input"
  shapes: "shapes"
  output: "output"
  latest: "latest"
  colors: "colors"

shapes:
  departments: "MGN_DPTO_POLITICO"
  departments_layer: "MGN_DPTO_POLITICO"
  countries: "ne_10m_admin_0_countries/ne_10m_admin_0_countries"
  countries_layer: "countries"

colors:
  visible: "grey255.cpt"
  infrared: "thermal.cpt"
  water_vapor: "WV.cpt"

plotting:
  resolution_zoomed: 0.2
  resolution_full: 1.5
  dpi_default: 100
  max_pixels: 65536
  radius_nautical_miles: 200
  show_rings: true
  ring_mode: "individual"  # Options: "centroid", "individual"
  label_offset_x: 0.01
  rect_height_factor: 0.03
  title_font_size_zoomed: 8
  institution_font_size_zoomed: 8
  title_font_size_full: 10
  institution_font_size_full: 10
  extent_default:
    - -100 #W
    - -14  #S
    - -50  #E
    - 30   #N

performance:
  max_download_workers: 6       # Concurrent download worker threads (recommended: 4 to 8)
  enable_pipeline_overlap: true  # Concurrently trigger image processing as downloads complete
